<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="title desc">
  <title id="title">bon: a proven kernel, programs around it</title>
  <desc id="desc">The kernel contains the spec, gates covering every decision bon makes, and their Rust implementation, proven by Verus. Programs in Go and TypeScript provide the terminal and web view; kernel gates compile to WebAssembly. Programs are built from what the kernel emits and decide nothing themselves. A decision request travels from a program into the kernel, and a proven decision returns.</desc>
  <defs>
    <marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--green)" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--blue)" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--indigo)" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--violet)" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--yellow)" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
:root{color-scheme:light dark;--bg:#f7f8fb;--surface:#ffffff;--soft:#edf0f5;--line:#d5dbe5;--ink:#182235;--muted:#637087;--red:#cf3d46;--orange:#c56427;--yellow:#ac7b08;--green:#16805b;--blue:#2269cc;--indigo:#5154bd;--violet:#8052b8;--red-bg:#fff0f0;--yellow-bg:#fff6d9;--green-bg:#e8f7ef;--blue-bg:#eaf2ff;--indigo-bg:#eeedff;--violet-bg:#f3ecfc}
@media(prefers-color-scheme:dark){:root{--bg:#0d1420;--surface:#151f2f;--soft:#1d293b;--line:#344257;--ink:#edf2fc;--muted:#a4b1c6;--red:#ff7a83;--orange:#f0a064;--yellow:#f1cd61;--green:#65d5a6;--blue:#7fb6ff;--indigo:#aaa5ff;--violet:#c09af0;--red-bg:#37212d;--yellow-bg:#342f1e;--green-bg:#17362f;--blue-bg:#1a304d;--indigo-bg:#29294b;--violet-bg:#30253f}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
.agent{font-size:11px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}.muted{fill:var(--muted)}.small{font-size:12px}.label{font-size:14px}.body{font-size:16px}.caption{font-size:29px;font-weight:650;letter-spacing:-.8px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.5px}.panel{fill:var(--surface);stroke:var(--line)}.line{fill:none;stroke:var(--line);stroke-width:1.5}.scene{opacity:0}.heavy{font-weight:650}
@keyframes write{0%,12%{transform:translateY(-9px);opacity:.7}40%,100%{transform:translateY(0);opacity:1}}
@keyframes flow{0%,8%{transform:translate(0,0);opacity:.5}72%,100%{transform:translate(var(--dx),var(--dy));opacity:1}}
@keyframes compact{0%,12%{transform:scaleX(1)}72%,100%{transform:scaleX(.5)}}
@keyframes converge{0%,10%{transform:translateX(var(--from-x))}65%,100%{transform:translateX(0)}}
@keyframes land{0%,8%{transform:translateX(0);fill:var(--blue)}75%,100%{transform:translateX(320px);fill:var(--indigo)}}
@media(prefers-reduced-motion:reduce){.packet{display:none}.compact{transform:scaleX(.5)!important}.land{transform:translateX(320px)!important;fill:var(--indigo)!important}}
@keyframes travel{0%,10%{stroke-dashoffset:54;opacity:0}20%{opacity:1}75%,100%{stroke-dashoffset:0;opacity:1}}
@keyframes arrive{0%,18%{opacity:0;transform:translateY(7px)}52%,100%{opacity:1;transform:translateY(0)}}
@keyframes reject{0%,20%{opacity:1}55%,100%{opacity:.72}}
@keyframes pulse{0%,20%{opacity:.3}60%,100%{opacity:1}}
@keyframes s0{0%{opacity:1}25.0000%{opacity:0}100%{opacity:0}}.s0{animation:s0 20s steps(1,end) infinite}@keyframes s1{0%{opacity:0}25.0000%{opacity:1}50.0000%{opacity:0}100%{opacity:0}}.s1{animation:s1 20s steps(1,end) infinite}@keyframes s2{0%{opacity:0}50.0000%{opacity:1}75.0000%{opacity:0}100%{opacity:0}}.s2{animation:s2 20s steps(1,end) infinite}@keyframes s3{0%{opacity:0}75.0000%{opacity:1}100%{opacity:1}}.s3{animation:s3 20s steps(1,end) infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}.scene{opacity:0!important}.s3{opacity:1!important}.motion{opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}@keyframes request{0%,12%{cx:229;opacity:0}20%{opacity:1}65%,100%{cx:274;opacity:1}}@keyframes response{0%,12%{cx:275;opacity:0}20%{opacity:1}65%,100%{cx:230;opacity:1}}@media(prefers-reduced-motion:reduce){circle.motion{cx:230}}</style>
  <rect width="880" height="500" rx="20" fill="var(--bg)"/>
  <text x="36" y="35" class="eyebrow muted">BON / A PROVEN CENTER</text>
  <text x="844" y="35" class="mono small muted" text-anchor="end">kernel + programs</text>
  <path d="M222 246 H282 M598 246 H658 M440 376 V406" class="line"/>
  <rect x="282" y="166" width="316" height="210" rx="18" fill="var(--violet-bg)" stroke="var(--violet)"/>
  <text x="306" y="199" class="mono caption" style="fill:var(--violet)">kernel</text>
  <rect x="476" y="177" width="98" height="28" rx="14" fill="var(--violet-bg)" stroke="var(--violet)"/>
  <text x="525.0" y="196" class="small heavy" style="fill:var(--violet)" text-anchor="middle">Verus</text>
  <text x="306" y="229" class="mono body heavy">spec</text>
  <text x="306" y="256" class="mono body heavy">gates</text>
  <text x="369" y="256" class="small muted">every decision bon makes</text>
  <path d="M306 273 H574" stroke="var(--violet)" stroke-opacity=".35"/>
  <text x="306" y="299" class="label muted">implementation</text>
  <text x="574" y="299" class="mono body heavy" text-anchor="end">Rust</text>
  <path d="M307 337 l4 4 8 -9" fill="none" stroke="var(--violet)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="329" y="342" class="label heavy" style="fill:var(--violet)">proven by Verus</text>
  <rect x="36" y="204" width="186" height="82" rx="12" fill="var(--surface)" stroke="var(--line)"/>
  <text x="52" y="226" class="mono small muted">program</text>
  <text x="52" y="251" class="mono body heavy">terminal</text>
  <text x="206" y="272" class="mono small muted" text-anchor="end">Rust</text>
  <rect x="658" y="204" width="186" height="82" rx="12" fill="var(--surface)" stroke="var(--line)"/>
  <text x="674" y="226" class="mono small muted">program</text>
  <text x="674" y="251" class="mono body heavy">web view</text>
  <text x="828" y="272" class="mono small muted" text-anchor="end">TypeScript</text>
  <rect x="318" y="406" width="244" height="82" rx="12" fill="var(--surface)" stroke="var(--line)"/>
  <text x="334" y="428" class="mono small muted">program</text>
  <text x="334" y="453" class="mono body heavy">WebAssembly</text>
  <text x="546" y="474" class="mono small muted" text-anchor="end">compiled gates</text>
  <g class="scene s0">
    <text x="36" y="91" class="caption" style="fill:var(--violet)">01</text>
    <text x="91" y="91" class="caption">The kernel owns every decision.</text>
    <path d="M36 126 H220" stroke="var(--violet)" stroke-width="3"/>
    <text x="36" y="148" class="small heavy" style="fill:var(--violet)">01 kernel</text>
    <path d="M243 126 H427" stroke="var(--line)" stroke-width="3"/>
    <text x="243" y="148" class="small heavy" style="fill:var(--muted)">02 emits</text>
    <path d="M450 126 H634" stroke="var(--line)" stroke-width="3"/>
    <text x="450" y="148" class="small heavy" style="fill:var(--muted)">03 asks</text>
    <path d="M657 126 H841" stroke="var(--line)" stroke-width="3"/>
    <text x="657" y="148" class="small heavy" style="fill:var(--muted)">04 returns</text>
    <rect x="283" y="167" width="314" height="208" rx="17" fill="none" stroke="var(--violet)" stroke-width="2" class="motion" style="animation:pulse 5s ease infinite"/>
    <text x="70" y="319" class="label muted">Programs decide</text>
    <text x="70" y="341" class="label muted">nothing themselves.</text>
  </g>
  <g class="scene s1">
    <text x="36" y="91" class="caption" style="fill:var(--indigo)">02</text>
    <text x="91" y="91" class="caption">Programs use what the kernel emits.</text>
    <path d="M36 126 H220" stroke="var(--line)" stroke-width="3"/>
    <text x="36" y="148" class="small heavy" style="fill:var(--muted)">01 kernel</text>
    <path d="M243 126 H427" stroke="var(--indigo)" stroke-width="3"/>
    <text x="243" y="148" class="small heavy" style="fill:var(--indigo)">02 emits</text>
    <path d="M450 126 H634" stroke="var(--line)" stroke-width="3"/>
    <text x="450" y="148" class="small heavy" style="fill:var(--muted)">03 asks</text>
    <path d="M657 126 H841" stroke="var(--line)" stroke-width="3"/>
    <text x="657" y="148" class="small heavy" style="fill:var(--muted)">04 returns</text>
    <path d="M280 246 L227 246" fill="none" stroke="var(--indigo)" stroke-width="1.5" marker-end="url(#arrow-indigo)"/>
    <circle cx="280" cy="246" r="3.5" fill="var(--indigo)" class="packet" style="--dx:-53px;--dy:0px;animation:flow 5s ease infinite"/>
    <path d="M600 246 L653 246" fill="none" stroke="var(--indigo)" stroke-width="1.5" marker-end="url(#arrow-indigo)"/>
    <circle cx="600" cy="246" r="3.5" fill="var(--indigo)" class="packet" style="--dx:53px;--dy:0px;animation:flow 5s ease infinite"/>
    <path d="M440 379 L440 401" fill="none" stroke="var(--indigo)" stroke-width="1.5" marker-end="url(#arrow-indigo)"/>
    <circle cx="440" cy="379" r="3.5" fill="var(--indigo)" class="packet" style="--dx:0px;--dy:22px;animation:flow 5s ease infinite"/>
    <text x="36" y="323" class="label muted">Built from what</text>
    <text x="36" y="345" class="label muted">the kernel emits.</text>
  </g>
  <g class="scene s2">
    <text x="36" y="91" class="caption" style="fill:var(--blue)">03</text>
    <text x="91" y="91" class="caption">A program asks the kernel.</text>
    <path d="M36 126 H220" stroke="var(--line)" stroke-width="3"/>
    <text x="36" y="148" class="small heavy" style="fill:var(--muted)">01 kernel</text>
    <path d="M243 126 H427" stroke="var(--line)" stroke-width="3"/>
    <text x="243" y="148" class="small heavy" style="fill:var(--muted)">02 emits</text>
    <path d="M450 126 H634" stroke="var(--blue)" stroke-width="3"/>
    <text x="450" y="148" class="small heavy" style="fill:var(--blue)">03 asks</text>
    <path d="M657 126 H841" stroke="var(--line)" stroke-width="3"/>
    <text x="657" y="148" class="small heavy" style="fill:var(--muted)">04 returns</text>
    <path d="M225 246 L277 246" fill="none" stroke="var(--blue)" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <circle cx="225" cy="246" r="3.5" fill="var(--blue)" class="packet" style="--dx:52px;--dy:0px;animation:flow 5s ease infinite"/>
    <circle r="5" cy="246" fill="var(--blue)" class="motion" style="animation:request 5s ease infinite"/>
    <rect x="53" y="310" width="151" height="28" rx="14" fill="var(--blue-bg)" stroke="var(--blue)"/>
    <text x="128.5" y="329" class="small heavy" style="fill:var(--blue)" text-anchor="middle">decision request</text>
    <rect x="300" y="236" width="278" height="29" rx="6" fill="none" stroke="var(--blue)" class="motion" style="animation:pulse 5s ease infinite"/>
  </g>
  <g class="scene s3">
    <text x="36" y="91" class="caption" style="fill:var(--violet)">04</text>
    <text x="91" y="91" class="caption">A proven decision returns.</text>
    <path d="M36 126 H220" stroke="var(--line)" stroke-width="3"/>
    <text x="36" y="148" class="small heavy" style="fill:var(--muted)">01 kernel</text>
    <path d="M243 126 H427" stroke="var(--line)" stroke-width="3"/>
    <text x="243" y="148" class="small heavy" style="fill:var(--muted)">02 emits</text>
    <path d="M450 126 H634" stroke="var(--line)" stroke-width="3"/>
    <text x="450" y="148" class="small heavy" style="fill:var(--muted)">03 asks</text>
    <path d="M657 126 H841" stroke="var(--violet)" stroke-width="3"/>
    <text x="657" y="148" class="small heavy" style="fill:var(--violet)">04 returns</text>
    <path d="M280 246 L227 246" fill="none" stroke="var(--violet)" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
    <circle cx="280" cy="246" r="3.5" fill="var(--violet)" class="packet" style="--dx:-53px;--dy:0px;animation:flow 5s ease infinite"/>
    <circle r="5" cy="246" fill="var(--violet)" class="motion" style="animation:response 5s ease infinite"/>
    <rect x="53" y="310" width="151" height="28" rx="14" fill="var(--violet-bg)" stroke="var(--violet)"/>
    <text x="128.5" y="329" class="small heavy" style="fill:var(--violet)" text-anchor="middle">proven decision</text>
    <path d="M183 227 l4 4 8 -9" fill="none" stroke="var(--violet)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M551 251 l4 4 8 -9" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="36" y="477" class="small muted">programs decide nothing</text>
  <text x="844" y="477" class="mono small muted" text-anchor="end">Rust → WebAssembly</text>
</svg>
