<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" role="img" aria-labelledby="t d">
  <title id="t">bon</title>
  <desc id="d">You write intents to the queue, then the spec and checks. One search: agent processes generate candidates; the tests and Verus verify them; two must agree; a counterexample search tries to split them; the best is selected and pushed to trunk. People try trunk and talk again. Below: the kernel (spec, gates, implementation, proven by Verus) emits types; programs in TypeScript, Go and Python are built on them, around trusted code.</desc>
  <style>
    svg { --bg:#F3EDE0; --surface:#FAF6EE; --ink:#1B1A18; --muted:#5C574F; --faint:#8F887C; --line:#DDD3C1;
          --red:#A61E1E; --orange:#B34A06; --yellow:#93680A; --green:#173D20; --blue:#122C61; --indigo:#33258A; --violet:#35165C; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#09090A; --surface:#111113; --ink:#EDEAE5; --muted:#A8A39B; --faint:#6E6A64; --line:#2E2E35;
            --red:#D57270; --orange:#E0874C; --yellow:#DFBE60; --green:#6F927A; --blue:#6E86B9; --indigo:#8378C7; --violet:#8369AA; }
    }
    text { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--ink); }
    .h { font-size: 11px; font-weight: 600; letter-spacing: .08em; fill: var(--faint); }
    .b { font-weight: 600; }
    .m { fill: var(--muted); }
    .f { fill: var(--faint); font-size: 12px; }
    .mono { font: 12px "SFMono-Regular", Menlo, monospace; fill: var(--muted); }
    .box { fill: var(--surface); stroke: var(--line); }
    .ln { stroke: var(--faint); stroke-width: 1.2; fill: none; }
    .dash { stroke-dasharray: 4 4; }
    .dot { stroke: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--faint)"/></marker>
  </defs>
  <rect width="880" height="452" fill="var(--bg)"/>
  <g transform="translate(0 12)">

  <!-- the owner's part -->
  <text class="h" x="24" y="34">YOU DECIDE</text>
  <rect class="box" x="24" y="46" width="118" height="54" rx="6"/>
  <text class="b" x="40" y="70">you</text><text class="f" x="40" y="88">talk, transcripts</text>
  <rect class="box" x="186" y="46" width="138" height="54" rx="6"/>
  <text class="b" x="202" y="70">queue</text><text class="f" x="202" y="88">wanted, not in the spec</text>
  <rect class="box" x="368" y="46" width="150" height="54" rx="6"/>
  <text class="b" x="384" y="70">spec and checks</text><text class="f" x="384" y="88">what must be true</text>
  <path class="ln" d="M142 73H182" marker-end="url(#a)"/>
  <path class="ln" d="M324 73H364" marker-end="url(#a)"/>

  <!-- one search -->
  <text class="h" x="24" y="146">SEARCH DECIDES</text>
  <rect class="box" x="24" y="160" width="694" height="108" rx="8"/>
  <path class="ln" d="M443 100V156" marker-end="url(#a)"/>
  <g>
    <circle class="dot" cx="46" cy="196" r="5" fill="var(--orange)"/><text class="b" x="58" y="200">generate</text><text class="f" x="58" y="218">n agent processes,</text><text class="f" x="58" y="234">a candidate each</text>
    <circle class="dot" cx="190" cy="196" r="5" fill="var(--green)"/><text class="b" x="202" y="200">verify</text><text class="f" x="202" y="218">tests accept it,</text><text class="f" x="202" y="234">Verus proves it</text>
    <circle class="dot" cx="322" cy="196" r="5" fill="var(--blue)"/><text class="b" x="334" y="200">agree</text><text class="f" x="334" y="218">two verified</text><text class="f" x="334" y="234">print the same</text>
    <circle class="dot" cx="446" cy="196" r="5" fill="var(--indigo)"/><text class="b" x="458" y="200">counterexample</text><text class="f" x="458" y="218">blind tests try</text><text class="f" x="458" y="234">to split them</text>
    <circle class="dot" cx="608" cy="196" r="5" fill="var(--violet)"/><text class="b" x="620" y="200">select</text><text class="f" x="620" y="218">the best, if</text><text class="f" x="620" y="234">none is found</text>
    <path class="ln" d="M136 196H178" marker-end="url(#a)"/><path class="ln" d="M256 196H310" marker-end="url(#a)"/><path class="ln" d="M380 196H434" marker-end="url(#a)"/><path class="ln" d="M566 196H596" marker-end="url(#a)"/>
  </g>
  <text class="f" x="44" y="258">four kinds share it: code · compaction · counterexample · queue. Blocked, it reruns wider; only a limit comes back to you.</text>

  <!-- trunk -->
  <rect class="box" x="752" y="186" width="104" height="54" rx="6"/>
  <text class="b" x="768" y="210">trunk</text><text class="f" x="768" y="228">pushed</text>
  <path class="ln" d="M718 213H748" marker-end="url(#a)"/>
  <path class="ln dash" d="M804 186V73H526" marker-end="url(#a)"/>
  <text class="f" x="620" y="66">tests on trunk, compaction</text>
  <path class="ln dash" d="M840 186V8H83V42" marker-end="url(#a)"/>
  <text class="f" x="636" y="2">people try it, and talk again</text>

  <!-- the kernel and what is built on it -->
  <text class="h" x="24" y="314">WHAT IT BUILDS</text>
  <rect class="box" x="24" y="328" width="250" height="88" rx="8"/>
  <text class="b" x="40" y="352">kernel</text><text class="m" x="40" y="372">spec · gates · implementation</text><text class="f" x="40" y="390">Rust, proven by Verus</text><text class="f" x="40" y="406">every decision lives here</text>
  <rect class="box" x="318" y="328" width="170" height="88" rx="8"/>
  <text class="b" x="334" y="352">emitted types</text><text class="mono" x="334" y="374">bon types</text><text class="f" x="334" y="394">checked on every candidate</text>
  <rect class="box" x="532" y="328" width="186" height="88" rx="8"/>
  <text class="b" x="548" y="352">programs</text><text class="m" x="548" y="372">TypeScript · Go · Python</text><text class="f" x="548" y="390">effects, built on the types;</text><text class="f" x="548" y="406">decide nothing</text>
  <path class="ln" d="M274 372H314" marker-end="url(#a)"/>
  <path class="ln" d="M488 372H528" marker-end="url(#a)"/>
  <rect x="752" y="328" width="104" height="88" rx="8" fill="none" stroke="var(--faint)" stroke-dasharray="4 4"/>
  <text class="b" x="768" y="352">trusted</text><text class="f" x="768" y="372">entry points,</text><text class="f" x="768" y="388">I/O; no search</text><text class="f" x="768" y="404">may change it</text>
  <path class="ln dash" d="M718 372H748"/>
  </g>
</svg>
