[package]
name = "best-of-n"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "bon"
path = "src/main.rs"

[dependencies]
vstd = "=0.0.0-2026-10-18-0147"
verus_state_machines_macros = "=0.0.0-2026-10-18-0147"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }
