[package]
name = "best-of-n"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
description = "best-of-N: you write what the software must do; verified agent search writes the code"
repository = "https://github.com/1zeroone0/best-of-n"
readme = "README.md"
default-run = "bon"
keywords = ["agents", "verification", "verus", "search", "build"]
categories = ["development-tools"]
exclude = ["/.bon/", "/assets/", "/examples/python/.venv/"]

[[bin]]
name = "bon"
path = "src/main.rs"

# One sample: context in, edits out; a harness `command` for wide searches.
[[bin]]
name = "bon-sample"
path = "src/bin/bon-sample.rs"

# engineer's tests, under checks/, which no search may change; tests/ holds
# the counterexamples' tests.
[[test]]
name = "encoding"
path = "checks/encoding.rs"

[[test]]
name = "bon-sample"
path = "checks/bon-sample.rs"

[[test]]
name = "new"
path = "checks/new.rs"

[[test]]
name = "oscal"
path = "checks/oscal.rs"

[dependencies]
vstd = "=0.0.0-2026-10-18-0147"
verus_state_machines_macros = "=0.0.0-2026-10-18-0147"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
ratatui = "0.30"

[package.metadata.verus]
verify = true

# Verus sets these when it verifies; cargo should expect them.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(verus_keep_ghost)', 'cfg(verus_keep_ghost_body)', 'cfg(verus_verify_core)'] }
